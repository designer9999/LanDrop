name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit reachable from origin/main" >&2
            exit 1
          }

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) {
            console.error("Release tags must use stable SemVer form vMAJOR.MINOR.PATCH");
            process.exit(1);
          }
          if (!fs.existsSync(`documentation/releases/${process.env.RELEASE_TAG}.md`)) {
            console.error("Release notes are missing for this tag");
            process.exit(1);
          }
          const expected = process.env.RELEASE_TAG.replace(/^v/, "");
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargoManifest = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(/^\s*version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = { tag: expected, package: packageVersion, tauri: tauriVersion, cargo: cargoVersion };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error("Release versions do not match:", versions);
            process.exit(1);
          }
          console.log(`Verified release version ${expected}`);
          NODE

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run verify
          npm audit --audit-level=high

      - name: Verify Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  prepare-release:
    name: Create draft release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "LanDrop $GITHUB_REF_NAME" \
              --notes-file "documentation/releases/$GITHUB_REF_NAME.md"
          fi

  build-windows:
    name: Windows
    needs: prepare-release
    permissions:
      contents: write
    environment: release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: tauri-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Windows artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LanDrop ${{ github.ref_name }}"
          releaseBody: "See the commit history for changes in this release. Install only artifacts published by this repository."
          releaseDraft: true
          prerelease: false
          args: -- --locked

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: build-windows
    permissions:
      contents: write
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: tauri-macos-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload macOS artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LanDrop ${{ github.ref_name }}"
          releaseBody: "See the commit history for changes in this release. Install only artifacts published by this repository."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} -- --locked

  build-linux:
    name: Linux
    needs: build-macos
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: tauri-linux

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Linux artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LanDrop ${{ github.ref_name }}"
          releaseBody: "See the commit history for changes in this release. Install only artifacts published by this repository."
          releaseDraft: true
          prerelease: false
          args: -- --locked

  build-android:
    name: Android (arm64)
    needs: build-linux
    if: ${{ vars.ENABLE_ANDROID_RELEASE == 'true' }}
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
      ANDROID_APPLICATION_ID: io.github.designer9999.landrop
      # Public fingerprint of the exposed historical signer. Never trust it again.
      ANDROID_REVOKED_CERT_SHA256: D55EE2D0DBBC31BDB14FAD8BB15D0C9104F829F0D169AA8AFD53E4598C996CB9
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preflight private Android signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_EXPECTED_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          EXPECTED_CERT=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          [[ "$EXPECTED_CERT" =~ ^[0-9A-F]{64}$ ]]
          test "$EXPECTED_CERT" != "$ANDROID_REVOKED_CERT_SHA256"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Verify new Android identity and signing certificate before build
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/landrop-release.jks"
          trap 'rm -f -- "$RUNNER_TEMP/landrop-release.jks" "$RUNNER_TEMP/landrop-release-cert.der"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          keytool -exportcert -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/landrop-release-cert.der" >/dev/null
          ACTUAL_CERT=$(sha256sum "$RUNNER_TEMP/landrop-release-cert.der" | awk '{ print toupper($1) }')
          EXPECTED_CERT=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          [[ "$ACTUAL_CERT" =~ ^[0-9A-F]{64}$ ]]
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          test "$ACTUAL_CERT" != "$ANDROID_REVOKED_CERT_SHA256"

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const base = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const android = JSON.parse(fs.readFileSync("src-tauri/tauri.android.conf.json", "utf8"));
          assert.equal(base.identifier, "com.landrop.app", "Desktop identity must remain unchanged");
          assert.equal(android.identifier, process.env.ANDROID_APPLICATION_ID, "Android platform override must use the new identity");
          assert.equal(android.version ?? base.version, process.env.GITHUB_REF_NAME.slice(1), "Android config version must match the tag");
          NODE

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install pinned Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platforms;android-36"
          for tool in aapt apksigner zipalign; do
            test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/$tool"
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: tauri-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        # Tauri automatically merges tauri.android.conf.json for this target,
        # including both the application package and generated Rust JNI names.
        run: npx tauri android build --target aarch64 --apk --ci -- --locked
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Test Android release Kotlin helpers
        shell: bash
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash src-tauri/gen/android/gradlew --no-daemon \
            -p src-tauri/gen/android \
            :app:testArm64ReleaseUnitTest -x :app:rustBuildArm64Release

      - name: Verify packaged Android ELF 16-KB alignment
        shell: bash
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          node --test scripts/Verify-AndroidElfAlignment.test.mjs
          mapfile -d '' -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release-unsigned.apk" -print0)
          test "${#APKS[@]}" -eq 1
          node scripts/Verify-AndroidElfAlignment.mjs \
            --apk "${APKS[0]}" \
            --readelf "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --jar "$JAVA_HOME/bin/jar"

      - name: Sign and verify Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mapfile -d '' -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*release-unsigned.apk" -print0)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned Android release APK" >&2
            exit 1
          fi
          APK="${APKS[0]}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          export BADGING_PATH="$RUNNER_TEMP/landrop-apk-badging.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$BADGING_PATH"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const badging = fs.readFileSync(process.env.BADGING_PATH, "utf8");
          const packageLine = badging.split(/\r?\n/).find(line => line.startsWith("package: ")) ?? "";
          const attributes = Object.fromEntries([...packageLine.matchAll(/(\w+)='([^']*)'/g)].map(match => [match[1], match[2]]));
          const version = process.env.GITHUB_REF_NAME.slice(1);
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const [major, minor, patch] = version.split(".").map(Number);
          const versionCode = major * 1000000 + minor * 1000 + patch;
          assert(Number.isSafeInteger(versionCode) && versionCode > 0 && versionCode <= 2100000000);
          assert.equal(attributes.name, process.env.ANDROID_APPLICATION_ID, "APK uses the wrong Android identity");
          assert.equal(attributes.versionName, version, "APK versionName does not match the release tag");
          assert.equal(attributes.versionCode, String(versionCode), "APK versionCode does not match the Tauri version mapping");
          assert.match(badging, /^sdkVersion:'24'$/m);
          assert.match(badging, /^targetSdkVersion:'36'$/m);
          assert.match(badging, /^native-code: 'arm64-v8a'\s*$/m);
          assert(!/^application-debuggable/m.test(badging), "A debuggable APK must not be released");
          NODE
          # Private material exists only during preflight/signing, not while
          # dependency installers or the application build run.
          umask 077
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/landrop-release.jks"
          trap 'rm -f -- "$RUNNER_TEMP/landrop-release.jks" "$RUNNER_TEMP/landrop-release-cert.der"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$APK" landrop-android-arm64-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 landrop-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out landrop-android-arm64-release.apk \
            landrop-android-arm64-aligned.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 landrop-android-arm64-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs landrop-android-arm64-release.apk \
            > "$RUNNER_TEMP/landrop-apk-signature.txt"
          SIGNER_COUNT=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest: / { count++ } END { print count+0 }' "$RUNNER_TEMP/landrop-apk-signature.txt")
          test "$SIGNER_COUNT" = "1"
          ACTUAL_CERT=$(awk -F': ' '/^Signer #1 certificate SHA-256 digest: / { print toupper($2) }' "$RUNNER_TEMP/landrop-apk-signature.txt" \
            | tr -d ':[:space:]')
          EXPECTED_CERT=$(printf '%s' "$ANDROID_EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          [[ "$ACTUAL_CERT" =~ ^[0-9A-F]{64}$ ]]
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          test "$ACTUAL_CERT" != "$ANDROID_REVOKED_CERT_SHA256"
          "$BUILD_TOOLS/aapt" dump badging landrop-android-arm64-release.apk > "$RUNNER_TEMP/landrop-apk-signed-badging.txt"
          cmp "$BADGING_PATH" "$RUNNER_TEMP/landrop-apk-signed-badging.txt"
          echo "Verified new Android identity, release version, arm64 ABI, alignment and approved signer"

      - name: Remove temporary Android signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/landrop-release.jks" "$RUNNER_TEMP/landrop-release-cert.der"

      - name: Upload Android APK to draft release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ github.ref_name }}
          files: landrop-android-arm64-release.apk
          draft: true
          prerelease: false
          fail_on_unmatched_files: true

  publish-release:
    name: Publish completed release
    needs:
      - build-windows
      - build-macos
      - build-linux
      - build-android
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      ${{
        always()
        && needs.build-windows.result == 'success'
        && needs.build-macos.result == 'success'
        && needs.build-linux.result == 'success'
        && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
      }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release assets and publish checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
        run: |
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets

          require_asset() {
            pattern="$1"
            if [ -z "$(find release-assets -maxdepth 1 -type f -name "$pattern" -print -quit)" ]; then
              echo "Required release asset is missing: $pattern" >&2
              exit 1
            fi
          }

          require_asset "*_x64-setup.exe"
          require_asset "*_x64-setup.exe.sig"
          require_asset "*_aarch64.dmg"
          require_asset "*_x64.dmg"
          require_asset "*_amd64.AppImage"
          require_asset "*_amd64.AppImage.sig"
          require_asset "*_amd64.deb"
          require_asset "*_amd64.deb.sig"
          require_asset "LanDrop_aarch64.app.tar.gz"
          require_asset "LanDrop_aarch64.app.tar.gz.sig"
          require_asset "LanDrop_x64.app.tar.gz"
          require_asset "LanDrop_x64.app.tar.gz.sig"
          require_asset "latest.json"
          if [ "$ANDROID_RESULT" = "success" ]; then
            require_asset "landrop-android-arm64-release.apk"
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          jq -e --arg version "$VERSION" '
            .version == $version and (.platforms | type == "object")
          ' release-assets/latest.json >/dev/null

          verify_updater_entry() {
            platform="$1"
            pattern="$2"
            mapfile -t matches < <(
              find release-assets -maxdepth 1 -type f -name "$pattern" -printf '%f\n'
            )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one updater asset for $platform ($pattern)" >&2
              exit 1
            fi

            asset="${matches[0]}"
            signature_file="release-assets/$asset.sig"
            test -s "$signature_file"
            expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset"
            manifest_url=$(jq -r --arg platform "$platform" \
              '.platforms[$platform].url // empty' release-assets/latest.json)
            manifest_signature=$(jq -r --arg platform "$platform" \
              '.platforms[$platform].signature // empty' release-assets/latest.json)
            file_signature=$(<"$signature_file")

            if [ "$manifest_url" != "$expected_url" ]; then
              echo "Updater URL mismatch for $platform" >&2
              exit 1
            fi
            if [ -z "$manifest_signature" ] || [ "$manifest_signature" != "$file_signature" ]; then
              echo "Updater signature mismatch for $platform" >&2
              exit 1
            fi
          }

          verify_updater_entry "windows-x86_64" "*_x64-setup.exe"
          verify_updater_entry "linux-x86_64" "*_amd64.AppImage"
          verify_updater_entry "darwin-x86_64" "LanDrop_x64.app.tar.gz"
          verify_updater_entry "darwin-aarch64" "LanDrop_aarch64.app.tar.gz"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS --clobber

      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file "documentation/releases/$GITHUB_REF_NAME.md" --draft=false
